name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel x64
            platform: macos-15-intel
            macos: true
            rust-targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin -- --locked
          - name: macOS Apple Silicon arm64
            platform: macos-15
            macos: true
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin -- --locked
          - name: Linux x64
            platform: ubuntu-22.04
            macos: false
            rust-targets: ""
            args: -- --locked
          - name: Windows x64
            platform: windows-latest
            macos: false
            rust-targets: ""
            args: -- --locked

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Restore Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract changelog entry
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          {
            echo 'body<<CHANGELOG_EOF'
            cat release-notes.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate updater signing configuration
        shell: bash
        env:
          NEXTMAIL_UPDATER_PUBLIC_KEY: ${{ vars.NEXTMAIL_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$NEXTMAIL_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Build and upload release bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.macos && '-' || '' }}
          NEXTMAIL_UPDATER_PUBLIC_KEY: ${{ vars.NEXTMAIL_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: NextMail ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          args: ${{ matrix.args }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Normalize updater manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/nextmail-updater"
          gh release download "$GITHUB_REF_NAME" \
            --pattern latest.json \
            --dir "$RUNNER_TEMP/nextmail-updater"
          gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" \
            > "$RUNNER_TEMP/nextmail-updater/release.json"
          jq --slurpfile release "$RUNNER_TEMP/nextmail-updater/release.json" '
            ($release[0].assets
              | map({ key: .url, value: .browser_download_url })
              | from_entries) as $download_urls
            | .platforms |= with_entries(
                .value.url = ($download_urls[.value.url] // .value.url)
              )
          ' "$RUNNER_TEMP/nextmail-updater/latest.json" \
            > "$RUNNER_TEMP/nextmail-updater/latest-normalized.json"
          mv "$RUNNER_TEMP/nextmail-updater/latest-normalized.json" \
            "$RUNNER_TEMP/nextmail-updater/latest.json"

          version="${GITHUB_REF_NAME#v}"
          direct_prefix="https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME/"
          jq -e --arg version "$version" --arg prefix "$direct_prefix" '
            (.version == $version)
            and (.platforms | length > 0)
            and all(.platforms[];
              ((.signature | length) > 0) and (.url | startswith($prefix)))
          ' "$RUNNER_TEMP/nextmail-updater/latest.json" > /dev/null

          jq '
            .platforms |= with_entries(
              .value.url = ("https://proxy.next-mail.app/" + .value.url)
            )
          ' "$RUNNER_TEMP/nextmail-updater/latest.json" \
            > "$RUNNER_TEMP/nextmail-updater/latest-cn.json"
          proxy_prefix="https://proxy.next-mail.app/$direct_prefix"
          jq -e --arg prefix "$proxy_prefix" '
            (.platforms | length > 0)
            and all(.platforms[];
              ((.signature | length) > 0) and (.url | startswith($prefix)))
          ' "$RUNNER_TEMP/nextmail-updater/latest-cn.json" > /dev/null

          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/nextmail-updater/latest.json" \
            "$RUNNER_TEMP/nextmail-updater/latest-cn.json" \
            --clobber

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
