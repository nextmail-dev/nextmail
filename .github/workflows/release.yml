name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel x64
            platform: macos-15-intel
            macos: true
            rust-targets: x86_64-apple-darwin
            updater-signatures: macos-x64
            args: --target x86_64-apple-darwin -- --locked
          - name: macOS Apple Silicon arm64
            platform: macos-15
            macos: true
            rust-targets: aarch64-apple-darwin
            updater-signatures: macos-arm64
            args: --target aarch64-apple-darwin -- --locked
          - name: Linux x64
            platform: ubuntu-22.04
            macos: false
            rust-targets: ""
            updater-signatures: linux-x64
            args: -- --locked
          - name: Windows x64
            platform: windows-latest
            macos: false
            rust-targets: ""
            updater-signatures: windows-x64
            args: -- --locked

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Restore Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract changelog entry
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          {
            echo 'body<<CHANGELOG_EOF'
            cat release-notes.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate updater signing configuration
        shell: bash
        env:
          NEXTMAIL_UPDATER_PUBLIC_KEY: ${{ vars.NEXTMAIL_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$NEXTMAIL_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Build and upload release bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.macos && '-' || '' }}
          NEXTMAIL_UPDATER_PUBLIC_KEY: ${{ vars.NEXTMAIL_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: NextMail ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Collect updater signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updater-signatures
          while IFS= read -r -d '' signature; do
            destination="updater-signatures/$(basename "$signature")"
            test ! -e "$destination"
            cp "$signature" "$destination"
          done < <(find src-tauri/target -type f -name '*.sig' -print0)
          test -n "$(find updater-signatures -type f -name '*.sig' -print -quit)"

      - name: Upload updater signatures
        uses: actions/upload-artifact@v7
        with:
          name: updater-signatures-${{ matrix.updater-signatures }}
          path: updater-signatures/*.sig
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download updater signatures
        uses: actions/download-artifact@v8
        with:
          pattern: updater-signatures-*
          path: ${{ runner.temp }}/nextmail-updater/signatures
          merge-multiple: true

      - name: Extract changelog entry
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \\[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/nextmail-updater/release-notes.md"
          test -s "$RUNNER_TEMP/nextmail-updater/release-notes.md"

      - name: Generate updater manifests
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/generate-updater-manifests.mjs \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --signatures "$RUNNER_TEMP/nextmail-updater/signatures" \
            --notes "$RUNNER_TEMP/nextmail-updater/release-notes.md" \
            --output "$RUNNER_TEMP/nextmail-updater/manifests"

      - name: Upload manifests and publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/nextmail-updater/manifests/latest.json
            ${{ runner.temp }}/nextmail-updater/manifests/latest-cn.json
          token: ${{ secrets.GITHUB_TOKEN }}
